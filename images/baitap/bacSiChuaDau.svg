<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <g id="plus">
      <rect x="-11" y="-34" width="22" height="68" rx="9" fill="#ffffff"/>
      <rect x="-34" y="-11" width="68" height="22" rx="9" fill="#ffffff"/>
    </g>
    <g id="pill">
      <rect x="-38" y="-16" width="76" height="32" rx="16" fill="#ffffff"/>
      <rect x="-38" y="-16" width="38" height="32" rx="16" fill="#A7F3D0"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#0D9488" stroke-width="3" opacity="0.5"/>
    </g>
    <g id="heart">
      <path d="M0 14 C -18 -4 -30 -14 -18 -26 C -10 -33 0 -27 0 -18 C 0 -27 10 -33 18 -26 C 30 -14 18 -4 0 14 Z" fill="#ffffff"/>
    </g>
    <g id="ecg">
      <path d="M-60 0 H-30 L-20 -26 L-6 30 L6 -14 L16 0 H60" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- soft bokeh circles -->
  <g fill="#ffffff">
    <circle cx="130" cy="120" r="110" opacity="0.10"/>
    <circle cx="700" cy="150" r="140" opacity="0.09"/>
    <circle cx="600" cy="520" r="120" opacity="0.10"/>
    <circle cx="180" cy="500" r="90" opacity="0.08"/>
    <circle cx="410" cy="300" r="70" opacity="0.06"/>
  </g>

  <!-- scattered medical motifs -->
  <use href="#plus" x="150" y="140" opacity="0.85" transform="rotate(-12 150 140)"/>
  <use href="#plus" x="670" y="430" opacity="0.7" transform="rotate(14 670 430)"/>
  <use href="#plus" x="720" y="90" opacity="0.5" transform="scale(0.7) translate(310 40)"/>
  <use href="#plus" x="90" y="360" opacity="0.55" transform="scale(0.8) translate(24 90)"/>

  <use href="#pill" x="520" y="200" opacity="0.9" transform="rotate(-28 520 200)"/>
  <use href="#pill" x="250" y="470" opacity="0.75" transform="rotate(18 250 470)"/>
  <use href="#pill" x="620" y="350" opacity="0.5" transform="rotate(50 620 350) scale(0.8)"/>

  <use href="#heart" x="330" y="150" opacity="0.85" transform="scale(1.5) translate(-110 -40)"/>
  <use href="#heart" x="560" y="470" opacity="0.6"/>
  <use href="#heart" x="120" y="240" opacity="0.5" transform="scale(0.8) translate(30 55)"/>

  <use href="#ecg" x="400" y="330" opacity="0.8" transform="scale(1.6) translate(-150 -120)"/>
</svg>
